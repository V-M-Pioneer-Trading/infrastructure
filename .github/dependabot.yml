# Keeps the SHA-pinned actions in .github/workflows/ up to date. Dependabot
# understands `uses: owner/action@<sha> # vX.Y.Z` pins and bumps both the SHA
# and the version comment in one PR. The terraform entries watch each stack's
# provider constraints and .terraform.lock.hcl (Dependabot does not recurse, so
# one entry per stack directory is required).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /agent-service
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /automation-service
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /ci-deploy-role
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /fleet-service
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /navigation-service
    schedule:
      interval: weekly
